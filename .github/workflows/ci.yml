name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # Wait until mongo is ready before the job tries to connect.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The DB-backed tests need this; SolisCloud creds are not needed because
      # tests mock the upstream via httpx.MockTransport.
      SOLIS_MONGODB_URI: mongodb://localhost:27017
      SOLIS_MONGODB_DB: solis_ci
      SESSION_SECRET: ci-only-session-secret
      # Stop the scheduler from starting (it never would in tests, but make
      # the intent explicit).
      RUN_SCHEDULER: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run python -m ruff check .

      - name: Mypy
        run: uv run python -m mypy

      - name: Pytest
        run: uv run python -m pytest -n auto -v
