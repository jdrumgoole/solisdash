[project]
name = "solisdash"
version = "0.7.2"
description = "Self-hosted dashboard for the SolisCloud (Ginlong Solis) platform"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joe Drumgoole", email = "joe@joedrumgoole.com" }]
keywords = ["soliscloud", "ginlong-solis", "solar", "photovoltaic", "dashboard", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pymongo>=4.13",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "apscheduler>=3.10,<4",
    "pywebview>=5",
    "tomli-w>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "mypy>=1.13",
    "tomli>=2",  # `tomllib` is stdlib from 3.11; install tomli everywhere for dev so the mypy ignore stays unconditional
    "invoke>=2.2",  # only used by repo-root `tasks.py`, not shipped in the wheel
]

[project.scripts]
solisdash = "solisdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/jdrumgoole/solisdash"
Repository = "https://github.com/jdrumgoole/solisdash"
Issues = "https://github.com/jdrumgoole/solisdash/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/solisdash"]

[tool.hatch.build.targets.sdist]
# Keep the sdist lean — the upstream PDF (~800kB) is reference material we
# read during development, not something users of the package need.
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/uv.lock",
    "/tasks.py",
    "/.python-version",
    "/.env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "tasks.py"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
