{% extends "base.html" %}
{% block title %}Sign in · Solisdash{% endblock %}
{% block content %}
<article class="login-card">
  <hgroup>
    <h2>Sign in</h2>
    <p>Solisdash needs a session before it shows you any data.</p>
  </hgroup>

  {% if error %}
    <p role="alert" class="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      autocomplete="username"
      value="{{ username|default('') }}"
      required
      autofocus
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    />

    <button type="submit">Sign in</button>
  </form>
</article>
{% endblock %}
