{% extends "base.html" %}
{% block title %}Dashboard · Solisdash{% endblock %}
{% block content %}
<hgroup>
  <h2>
    {% if tiles and tiles.station_name %}{{ tiles.station_name }}{% else %}Dashboard{% endif %}
  </h2>
  <p>Welcome, {{ user.username }}.</p>
</hgroup>

<section
  id="tiles"
  aria-live="polite"
  hx-get="/tiles"
  hx-trigger="every 30s"
  hx-swap="innerHTML"
>
  {% include "_tiles.html" %}
</section>
{% endblock %}
